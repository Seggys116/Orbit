version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - ci

  # GitHub Actions only. The browser is system WebKit: there is no Chromium
  # pin, depot_tools submodule, or other third-party checkout for Dependabot
  # to bump.
  # No swift entry: Dependabot reads Package.swift, and Sparkle lives in
  # Orbit.xcodeproj. Bump it in Xcode and commit Package.resolved.
