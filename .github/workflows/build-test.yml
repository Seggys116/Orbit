name: Build and test
run-name: ${{ inputs.run_marker || 'Build and test' }}

# The verification half of CI, factored out so that ci.yml and release.yml run
# the identical checks. A tag push does not trigger ci.yml, and `needs:` does
# not reach across workflows, so without this the release path would drift.
on:
  workflow_call:
  # Dispatched, not called, for a branch whose content is not trusted yet: the
  # run's cache scope is then that branch rather than the default branch.
  workflow_dispatch:
    inputs:
      run_marker:
        description: "Run name, so a dispatching workflow can find this run again"
        required: false
        type: string

permissions:
  contents: read

jobs:
  manifest:
    name: Manifest and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Byte-compile the Python scripts
        run: |
          python3 -m compileall -q \
            Scripts/xcodeproj_sync.py \
            Scripts/test_verdict.py \
            Scripts/app_launch_smoke.py \
            Scripts/extension_schemas.py

      # The guard that decides whether the test job really ran anything is
      # itself derived from the sources, so a parse it cannot handle has to
      # fail here, cheaply, rather than as a mismatch after a full build.
      - name: The test inventory can be read from the sources
        run: Scripts/test-verdict declared --target OrbitTests --target OrbitAppTests

      # Same rule for the launch smoke: the stages and checks every launch has
      # to reach are read out of Orbit/Core/AppSmokeProbe.swift, so a renamed
      # enum has to fail here rather than as an unparseable inventory after a
      # full build on a macOS runner.
      - name: The launch-smoke inventory can be read from the sources
        run: Scripts/app-launch-smoke declared

      - name: Security guards
        run: Scripts/security-guards

      - name: Shellcheck
        run: |
          shellcheck \
            Scripts/xcodeproj-sync \
            Scripts/screenshots \
            Scripts/live-engine-tests \
            Scripts/test-verdict \
            Scripts/app-launch-smoke \
            Scripts/sign-app.sh \
            Scripts/package-dmg.sh \
            Scripts/notarize.sh \
            Scripts/security-guards

  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 150
    env:
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      # Orbit.xcodeproj lists every file explicitly rather than using Xcode's
      # synchronized folders, whose build-time file-type inference mistyped
      # .swift files as plain text and silently dropped them from compilation.
      # This catches a source file added without re-running the synchroniser.
      - name: Project file lists match the working tree
        run: Scripts/xcodeproj-sync --check

      - name: Restore the Swift package checkouts
        id: swiftpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Orbit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # ThirdParty/* is gitignored. The corpus tests load the unpacked pins, so a checkout without
      # this step fails them as notVendored before any extension code runs.
      - name: Fetch the pinned extension corpus
        run: Scripts/extension-corpus fetch

      # This job runs every hosted test, the live WebKit suites included, in one shared test process; only tests declared
      # CANNOT-RUN are excluded. .github/workflows/live-engine.yml re-runs the live suites nightly through
      # Scripts/live-engine-tests.
      - name: Test
        run: |
          set -o pipefail
          # Generated from the '// ORBIT-HOSTED-RUNNER: CANNOT-RUN' declarations in the
          # sources, so the excluded set lives next to the tests rather than in this file.
          # while-read, not mapfile: the runner's /bin/bash is 3.2 and has no mapfile.
          SKIP_ARGS=()
          while IFS= read -r arg; do SKIP_ARGS+=("$arg"); done \
            < <(Scripts/test-verdict excluded --target OrbitTests --target OrbitAppTests)
          printf 'skipping %d test(s) declared unrunnable on a hosted runner\n' "${#SKIP_ARGS[@]}"

          xcodebuild test \
            "${SKIP_ARGS[@]}" \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee TestResults.log

      # hashFiles stops a build that died before resolution caching nothing.
      - name: Save the Swift package checkouts
        if: always() && steps.swiftpm.outputs.cache-hit != 'true' && hashFiles('DerivedData/SourcePackages/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}

      # xcodebuild exits 0 for a run that built and executed nothing, so the
      # step above cannot tell a green suite from an absent one. This compares
      # the executed tests against the tests declared in the sources, and runs
      # even when xcodebuild failed so that the reason is named.
      - name: Verify the test run
        if: always()
        run: |
          Scripts/test-verdict \
            --result-bundle TestResults.xcresult \
            --log TestResults.log \
            --target OrbitTests \
            --target OrbitAppTests \
            --allow-hosted-runner-exclusions \
            --max-retries-allowed 5

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            TestResults.log
          retention-days: 14

      # Everything above runs inside an XCTest host: a different principal
      # class, a different applicationDidFinishLaunching order and no
      # window-server session of its own. Nothing above has ever launched the
      # app bundle a user launches, which is why a crash on the AppKit
      # window-creation path shipped with 1722 unit tests and 155 live tests
      # green. This launches both bundles through LaunchServices, three times
      # each because that crash is intermittent, and fails unless every launch
      # reached a painted page, left the real profile alone and quit cleanly.
      - name: Real app launch smoke
        run: |
          Scripts/app-launch-smoke \
            --derived-data DerivedData \
            --attempts 3 \
            --keep-going \
            -- \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Upload the launch-smoke evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppLaunchSmoke
          path: DerivedData/AppLaunchSmoke
          retention-days: 14
