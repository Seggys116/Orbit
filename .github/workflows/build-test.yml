name: Build and test

# The verification half of CI, factored out so that ci.yml and release.yml run
# the identical checks. A tag push does not trigger ci.yml, and `needs:` does
# not reach across workflows, so without this the release path would drift.
on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out. Empty means the caller's own ref."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  manifest:
    name: Manifest and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Validate the Chromium manifest
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("Chromium/chromium-version.json"))
          required = ["chromium_repo_url", "channel", "chromium_version",
                      "chromium_checkout", "build_target", "prebuilt"]
          missing = [k for k in required if k not in m]
          assert not missing, f"chromium-version.json is missing {missing}"
          assert m["chromium_checkout"] == f"refs/tags/{m['chromium_version']}", \
              "chromium_checkout does not match chromium_version"
          configs = m["prebuilt"].get("configs")
          assert configs is not None, "prebuilt.configs is missing"
          assert set(configs) == {"shipping", "dcheck"}, \
              f"prebuilt.configs must hold exactly shipping and dcheck, found {sorted(configs)}"
          for name, entry in configs.items():
              assert "platforms" in entry, f"prebuilt.configs.{name}.platforms is missing"
          print(f"manifest ok: Chromium {m['chromium_version']} ({m['channel']}), target {m['build_target']}")
          PY

      - name: Byte-compile the Python scripts
        run: |
          python3 -m compileall -q \
            Scripts/chromium_manager.py \
            Scripts/xcodeproj_sync.py \
            Scripts/test_verdict.py \
            Scripts/app_launch_smoke.py

      # The guard that decides whether the test job really ran anything is
      # itself derived from the sources, so a parse it cannot handle has to
      # fail here, cheaply, rather than as a mismatch after a full build.
      - name: The test inventory can be read from the sources
        run: Scripts/test-verdict declared --target OrbitTests --target OrbitAppTests

      # Same rule for the launch smoke: the stages and checks every launch has
      # to reach are read out of Orbit/Core/AppSmokeProbe.swift, so a renamed
      # enum has to fail here rather than as an unparseable inventory after a
      # full build on a macOS runner.
      - name: The launch-smoke inventory can be read from the sources
        run: Scripts/app-launch-smoke declared

      - name: Security guards
        run: Scripts/security-guards

      - name: Shellcheck
        run: |
          shellcheck \
            Scripts/chromium \
            Scripts/xcodeproj-sync \
            Scripts/screenshots \
            Scripts/live-engine-tests \
            Scripts/test-verdict \
            Scripts/app-launch-smoke \
            Scripts/ensure-chromium-engine.sh \
            Scripts/sign-app.sh \
            Scripts/package-dmg.sh \
            Scripts/notarize.sh \
            Scripts/security-guards

      - name: Generated sources are in sync with the manifest
        run: |
          Scripts/chromium sync
          git diff --exit-code -- Orbit/Generated

      # A clone has no Chromium/Generated/, so Chromium/Chromium.xcconfig alone
      # decides what a first build points at.
      - name: A fresh clone is configured for Chromium
        run: |
          grep -q '^ORBIT_CHROMIUM_ROOT = \$(SRCROOT)/ThirdParty/prebuilt/\$(ORBIT_ENGINE_CONFIG)$' Chromium/Chromium.xcconfig
          grep -q '^ORBIT_ENGINE_CONFIG = shipping$' Chromium/Chromium.xcconfig
          grep -q '^ORBIT_ENGINE_CONFIG\[config=Debug\] = dcheck$' Chromium/Chromium.xcconfig
          grep -q '^ORBIT_CHROMIUM_BUILD_TARGET = ' Chromium/Chromium.xcconfig
          # ThirdParty/*, not ThirdParty/: the submodule is re-included below it.
          grep -q '^ThirdParty/\*$' .gitignore
          grep -q '^!ThirdParty/depot_tools$' .gitignore
          grep -q '^Chromium/Generated/$' .gitignore

      # Chromium is the only engine `Scripts/chromium` knows how to fetch or
      # build; there is no --engine flag to select anything else. This proves
      # `sync` still writes real values rather than the flag having quietly
      # started accepting -- and ignoring -- an engine argument again.
      - name: Sync regenerates real values, and takes no engine argument
        run: |
          if Scripts/chromium sync --engine webkit >/dev/null 2>&1; then
            echo "Scripts/chromium sync accepts --engine again. Chromium is the only backend it knows." >&2
            exit 1
          fi
          Scripts/chromium sync
          grep -q '^ORBIT_CHROMIUM_VERSION = ' Chromium/Generated/Chromium.xcconfig

  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 150
    env:
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      # Orbit.xcodeproj lists every file explicitly rather than using Xcode's
      # synchronized folders, whose build-time file-type inference mistyped
      # .swift files as plain text and silently dropped them from compilation.
      # This catches a source file added without re-running the synchroniser.
      - name: Project file lists match the working tree
        run: Scripts/xcodeproj-sync --check

      # Here, not in the manifest job: plutil is macOS-only.
      - name: Every target depends on ChromiumEngine
        run: |
          python3 - <<'PY'
          import json, subprocess
          raw = subprocess.run(
              ["plutil", "-convert", "json", "-o", "-", "Orbit.xcodeproj/project.pbxproj"],
              capture_output=True, check=True).stdout
          objects = json.loads(raw)["objects"]
          targets = {o["name"]: o for o in objects.values()
                     if o.get("isa") in ("PBXNativeTarget", "PBXAggregateTarget")}
          assert "ChromiumEngine" in targets, "the ChromiumEngine aggregate target is gone"
          phases = [objects[p] for p in targets["ChromiumEngine"]["buildPhases"]]
          assert any("ensure-chromium-engine.sh" in p.get("shellScript", "") for p in phases), \
              "ChromiumEngine no longer runs Scripts/ensure-chromium-engine.sh"

          def reaches(name, seen=()):
              if name == "ChromiumEngine":
                  return True
              if name in seen:
                  return False
              return any(reaches(objects[objects[d]["target"]]["name"], seen + (name,))
                         for d in targets[name].get("dependencies", []))

          missing = [n for n in ("Orbit", "OrbitDemo", "OrbitTests", "OrbitAppTests")
                     if not reaches(n)]
          assert not missing, f"these targets do not depend on ChromiumEngine: {missing}"
          print("every target reaches ChromiumEngine")
          PY

      # Saved as soon as it installs, so a later test failure cannot lose it;
      # skipped on a hit, because a cache entry is immutable. No restore-keys.
      - name: Restore the Chromium engine
        id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ThirdParty/prebuilt
          key: chromium-dcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Chromium/chromium-version.json') }}

      # Not required (the ChromiumEngine phase would), but it keeps the download
      # out of the xcodebuild log and lets the cache work. dcheck, because Debug.
      - name: Install the Chromium engine
        run: Scripts/chromium fetch --config dcheck

      - name: Save the Chromium engine
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ThirdParty/prebuilt
          key: ${{ steps.engine.outputs.cache-primary-key }}

      - name: Chromium doctor
        run: Scripts/chromium doctor --config dcheck

      - name: Restore the Swift package checkouts
        id: swiftpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Orbit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Chromium is the only backend, so this is no longer "which one did we
      # pick" -- it is that the engine really is on disk, is the one a Debug
      # build embeds, and really is switched on for the compiler, before a
      # build that would otherwise take ten minutes to say so.
      - name: Confirm the engine backend
        run: |
          Scripts/chromium status --offline
          grep -q '^ORBIT_CHROMIUM_VERSION = ' Chromium/Generated/Chromium.xcconfig
          test -d ThirdParty/prebuilt/dcheck
          test ! -e Chromium/Generated/engine
          Scripts/chromium verify-engine --config dcheck

      # The live-engine suites skip in this job, by design and not by accident:
      # they start a real browser, fork five helper processes and put a window
      # on screen, which does not belong on the critical path of every pull
      # request. They are covered by .github/workflows/live-engine.yml --
      # nightly, on demand, and on any pull request labelled `live-engine` --
      # which runs them through Scripts/live-engine-tests and fails if they
      # skip. That is a claim worth checking rather than repeating: it was
      # written while that workflow was disabled, and 129 live tests were
      # consequently running in no job at all. Adding ORBIT_LIVE_ENGINE=1 to the
      # line below would achieve nothing anyway: xcodebuild does not hand its
      # environment to a hosted test target's process. Scripts/live-engine-tests
      # has the measured evidence.
      #
      # Those gate skips are the only skips this job declares as expected, via
      # --allow-live-engine-gate-skips below; a gate skip anywhere else, or a
      # skip in a suite whose source never calls XCTSkip, fails the job.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee TestResults.log

      # hashFiles stops a build that died before resolution caching nothing.
      - name: Save the Swift package checkouts
        if: always() && steps.swiftpm.outputs.cache-hit != 'true' && hashFiles('DerivedData/SourcePackages/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}

      # ORBIT-DIAG temporary, remove with the instrumentation it prints.
      - name: Popover crash diagnostics
        if: always()
        run: cat /tmp/orbit-diag.txt || echo "no diagnostics written"

      # xcodebuild exits 0 for a run that built and executed nothing, so the
      # step above cannot tell a green suite from an absent one. This compares
      # the executed tests against the tests declared in the sources, and runs
      # even when xcodebuild failed so that the reason is named.
      - name: Verify the test run
        if: always()
        run: |
          Scripts/test-verdict \
            --result-bundle TestResults.xcresult \
            --log TestResults.log \
            --target OrbitTests \
            --target OrbitAppTests \
            --allow-live-engine-gate-skips

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            TestResults.log
          retention-days: 14

      # Everything above runs inside an XCTest host: a different principal
      # class, a different applicationDidFinishLaunching order and no
      # window-server session of its own. Nothing above has ever launched the
      # app bundle a user launches, which is why a crash on the AppKit
      # window-creation path shipped with 1722 unit tests and 155 live tests
      # green. This launches both bundles through LaunchServices, three times
      # each because that crash is intermittent, and fails unless every launch
      # reached a painted page, left the real profile alone and quit cleanly.
      - name: Real app launch smoke
        run: |
          Scripts/app-launch-smoke \
            --derived-data DerivedData \
            --attempts 3 \
            --keep-going \
            -- \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Upload the launch-smoke evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppLaunchSmoke
          path: DerivedData/AppLaunchSmoke
          retention-days: 14
