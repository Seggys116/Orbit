name: Chromium update

# Orbit ships on system WebKit. This workflow does not pin, fetch, or rewrite a Chromium engine.
on:
  workflow_dispatch:

jobs:
  check:
    name: WebKit engine has no Chromium pin
    runs-on: ubuntu-latest
    steps:
      - name: Skip Chromium
        run: echo "Orbit uses system WebKit. Chromium is not a build input."
