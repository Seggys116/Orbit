# Live engine
#
# Nightly, on demand, and on pull requests labelled live-engine.
# Runs every live WebKit suite through Scripts/live-engine-tests.

name: Live engine

on:
  schedule:
    # 04:30 UTC daily, off-peak.
    - cron: "30 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    # `labeled` starts a run the moment the label goes on; `synchronize` and
    # `reopened` keep an already-labelled pull request covered as it changes.
    types: [labeled, synchronize, reopened]

concurrency:
  group: live-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    name: Live engine suites
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'live-engine')
    runs-on: macos-26
    # The full live set takes about 25 minutes on a developer Mac; a hosted runner is slower and the build comes first. Scripts/live-engine-tests
    # also applies a 600s per-test timeout, so a hung test fails by name well inside this.
    timeout-minutes: 120
    env:
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      # A suite missing from the project would still be counted from the sources and fail the count check confusingly.
      - name: Project file lists match the working tree
        run: Scripts/xcodeproj-sync --check

      - name: Restore the Swift package checkouts
        id: swiftpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Orbit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # ThirdParty/* is gitignored. Corpus suites load the unpacked pins.
      - name: Fetch the pinned extension corpus
        run: Scripts/extension-corpus fetch

      # One build, then one test process for every live suite. The step fails on any test failure, any skip, or an
      # executed count that differs from the count declared in the sources. Do not add a --suite filter: it would drop coverage silently.
      - name: Run the live WebKit suites
        run: |
          set -o pipefail
          Scripts/live-engine-tests \
            --results-dir "$RUNNER_TEMP/live-engine-results" \
            -- \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/live-engine.log"

      - name: Save the Swift package checkouts
        if: always() && steps.swiftpm.outputs.cache-hit != 'true' && hashFiles('DerivedData/SourcePackages/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}

      # The verdict line ("N/N live tests ...") in the job summary; "0 executed" is the failure this job exists to catch.
      - name: Summarise
        if: always()
        run: |
          {
            echo "## Live engine"
            echo ""
            echo '```'
            grep -E 'live-engine-tests:' "$RUNNER_TEMP/live-engine.log" \
              || echo "no verdict recorded -- the run did not get that far"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Always, not just on failure: a passing run is the baseline the next failure is read against.
      - name: Upload the logs and result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LiveEngineResults
          path: ${{ runner.temp }}/live-engine-results
          retention-days: 14
